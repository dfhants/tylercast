# Builds and tests the Windows port on a real Windows machine (GitHub-hosted).
# Free within the private-repo allowance; Windows minutes count double, so it
# runs only when windows/ (or this file) changes, and is capped at 15 minutes.
name: Windows

on:
  push:
    paths: ["windows/**", ".github/workflows/windows.yml"]
  pull_request:
    paths: ["windows/**", ".github/workflows/windows.yml"]
  workflow_dispatch:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: windows
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build -c Release
      - name: Test
        run: dotnet test -c Release --no-build --logger "trx;LogFileName=results.trx" --results-directory test-results
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: windows/test-results
          retention-days: 7
