# Builds and tests the Windows port on a real Windows machine (GitHub-hosted).
# Free within the private-repo allowance; Windows minutes count double, so it
# runs only when windows/ (or this file) changes, and is capped at 15 minutes.
name: Windows

on:
  push:
    paths: ["windows/**", ".github/workflows/windows.yml"]
  pull_request:
    paths: ["windows/**", ".github/workflows/windows.yml"]
  workflow_dispatch:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: windows
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build -c Release
      - name: Test
        run: dotnet test -c Release --no-build --logger "trx;LogFileName=results.trx" --results-directory test-results
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: windows/test-results
          retention-days: 7
      # Windows Server leaves Media Foundation out unless asked; the laptops have it.
      - name: Add Media Foundation (server only)
        continue-on-error: true
        shell: pwsh
        run: Install-WindowsFeature Server-Media-Foundation | Format-List
      - name: Publish tylercast.exe (as the test rounds get it)
        run: dotnet publish src/TylerCast.Cli -f net10.0-windows -r win-x64 -c Release --self-contained -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none -o out/win-x64
      - name: Publish TylerCast.exe (the tray app)
        run: dotnet publish src/TylerCast.App -r win-x64 -c Release --self-contained -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none -o out/app
      - name: Build the installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Host }
          & $iscc /Qp installer\TylerCast.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Get-ChildItem out\installer | Format-Table Name, Length
      - name: Install, run and uninstall
        shell: pwsh
        run: ./tools/test-installer.ps1 -Setup (Get-ChildItem out\installer\*.exe | Select-Object -First 1).FullName
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: installer
          path: windows/out/installer
          retention-days: 14
      # The flyout and settings window, rendered in every state, light and dark, to look at on the Mac.
      - name: Screenshots of the tray app
        continue-on-error: true
        timeout-minutes: 3
        run: out\app\TylerCast.exe --screenshot ci-screenshots | Out-Host
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: windows/ci-screenshots
          retention-days: 7
      # No screen, speakers or TV here, so some checks fail by design; this catches
      # crashes and bad Windows API calls before a real test round.
      - name: Selftest on the runner
        continue-on-error: true
        timeout-minutes: 5
        run: |
          out\win-x64\tylercast.exe diag
          out\win-x64\tylercast.exe selftest ci-selftest --no-tone
          Copy-Item "$env:LOCALAPPDATA\TylerCast\TylerCast.log" ci-selftest -ErrorAction SilentlyContinue
      - name: Upload selftest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selftest
          path: windows/ci-selftest
          retention-days: 7
