# Publishes a release when a version tag is pushed (git tag v0.2.0 && git push origin v0.2.0).
# The Windows installer (built, tested, installed and uninstalled on Windows) is published as
# soon as it's ready; the Mac app is added to the same release when its build finishes (macOS
# runners can queue for a long time, and Windows shouldn't wait). Run it by hand with a tag
# to rebuild and re-attach one platform's file. A tag with a hyphen (v0.3.0-beta1) makes a
# pre-release.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and attach files for (e.g. v0.2.0)"
        required: true
      platforms:
        description: "windows, mac, or both"
        default: both

env:
  TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: read

jobs:
  windows:
    if: ${{ !inputs.platforms || inputs.platforms != 'mac' }}
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: windows
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x
      - name: Version from the tag
        shell: pwsh
        run: |
          $v = $env:TAG.TrimStart('v').Split('-')[0]
          "VERSION=$v" >> $env:GITHUB_ENV
      - name: Test
        run: dotnet test -c Release
      - name: Publish TylerCast.exe
        run: dotnet publish src/TylerCast.App -r win-x64 -c Release --self-contained -p:Version=${{ env.VERSION }} -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none -o out/app
      - name: Build the installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --version=6.4.3 -y --no-progress | Out-Host }
          & $iscc /Qp "/DAppVersion=$env:VERSION" installer\TylerCast.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Install, run and uninstall
        shell: pwsh
        run: ./tools/test-installer.ps1 -Setup (Get-ChildItem out\installer\*.exe | Select-Object -First 1).FullName
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows
          path: windows/out/installer/*.exe

  mac:
    if: ${{ !inputs.platforms || inputs.platforms != 'windows' }}
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.TAG }}
      - name: Build TylerCast.app
        run: |
          v=${TAG#v}; v=${v%%-*}
          echo "VERSION=$v" >> "$GITHUB_ENV"
          VERSION=$v ./make-app.sh
          ditto -c -k --keepParent build/TylerCast.app "TylerCast-mac-$v.zip"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mac
          path: TylerCast-mac-*.zip

  # Creates the release with the Windows installer (or adds it, if the release exists).
  publish-windows:
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows
          path: dist
      - name: Publish
        run: |
          cd dist
          f=$(ls TylerCast-Setup-*.exe)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$f" --clobber
          else
            {
              echo "## Download"
              echo
              echo "- **Windows 10 (2004 or later) / 11:** \`$f\`. Not code-signed yet: if Windows says *Windows protected your PC*, click **More info**, then **Run anyway**."
              echo "- **macOS 14 or later, Apple silicon:** \`TylerCast-mac-<version>.zip\` (added when the Mac build finishes). Not signed by Apple yet: right-click TylerCast.app, choose **Open**, then **Open** (or **System Settings > Privacy & Security > Open Anyway**)."
              echo
              echo "(GitHub adds the *Source code* files to every release; you don't need them.)"
              echo
              echo "See the [README](https://github.com/$GH_REPO#download) for setup. SHA-256 hashes are in \`SHA256SUMS.txt\`."
            } > notes.md
            pre=""; case "$TAG" in *-*) pre="--prerelease";; esac
            gh release create "$TAG" "$f" --title "TylerCast ${TAG#v}" --notes-file notes.md $pre
          fi

  # Adds the Mac app to the release (waiting for the Windows job to create it, if it's still going).
  publish-mac:
    needs: mac
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: mac
          path: dist
      - name: Publish
        run: |
          for i in $(seq 1 60); do gh release view "$TAG" >/dev/null 2>&1 && break; sleep 30; done
          gh release upload "$TAG" dist/TylerCast-mac-*.zip --clobber

  # SHA256SUMS.txt for whatever the release holds now (runs after each publisher).
  sums:
    needs: [publish-windows, publish-mac]
    if: ${{ always() && (needs.publish-windows.result == 'success' || needs.publish-mac.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Hash the release's files
        run: |
          mkdir dist && cd dist
          gh release download "$TAG" --pattern 'TylerCast-*'
          sha256sum TylerCast-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "$TAG" SHA256SUMS.txt --clobber
